name: Dev Build FPK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Vue Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Server Production Dependencies
        run: |
          cd app/server
          npm install --omit=dev

      - name: Build fnOS .fpk Package (Dev Mode)
        env:
          DEV_BUILD: 'true'
        run: |
          node scripts/build_fpk.js

      - name: Upload All-Arch FPK
        uses: actions/upload-artifact@v4
        with:
          name: novelai-fpk-all
          path: dist_fpk/*_all.fpk
          retention-days: 14

      - name: Upload AMD64 (x86_64) FPK
        uses: actions/upload-artifact@v4
        with:
          name: novelai-fpk-amd64
          path: dist_fpk/*_amd64.fpk
          retention-days: 14

      - name: Upload ARM64 FPK
        uses: actions/upload-artifact@v4
        with:
          name: novelai-fpk-arm64
          path: dist_fpk/*_arm64.fpk
          retention-days: 14
